[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rtoken-breakout-lab"
version = "0.2.0"
description = "Reproducible rToken spot breakout research with frozen historical validation"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
